version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 20
  build:
    commands:
      - echo "Executando react build"
      - cd client
      - npm install
      - REACT_APP_API_URL=http://localhost:3000 SKIP_PREFLIGHT_CHECK=true npm run build

artifacts:
  files:
    - "**/*"
  base-directory: client/build
