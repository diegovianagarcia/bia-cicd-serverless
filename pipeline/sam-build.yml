version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 20
    build:
      commands:
      - echo "Installing sam build"
      - sam build -t template.yaml
      - sam package --template .aws-sam/build/template.yaml --output-template-file template-out-bia-serverless-sam.yaml --s3-bucket bia-sam-pipeline --config-env default
artifacts:
  files:
    - template-out-bia-serverless-sam.yaml
